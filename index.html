<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenido</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #000000;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 380px;
      height: 100vh;
      background-color: #ffffff;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      border: 2px solid #333;
    }

    .data-table th, .data-table td {
      border: 1px solid #333;
      padding: 8px;
      text-align: center;
      font-size: 0.9em;
    }

    .data-table th {
      background-color: #f0f0f0;
      font-weight: bold;
    }

    .button-row {
      text-align: center;
      padding: 10px;
    }

    .button-row button {
      background-color: #4CAF50;
      color: white;
      font-size: 1em;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 5px;
    }

    .button-row button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

  <div class="container">
    <img src="Logo_itfip.png" alt="Logo o Imagen Principal" width="30%" height="15%">

    <form action="#" method="post">
      <table class="data-table">
        <!-- Fila con el título y subtítulo de la tabla -->
        <tr>
          <th colspan="2" class="title-cell">"ITFIP" INSTITUTO DE EDUCACION SUPERIOR</th>
        </tr>
        <tr>
          <th colspan="2" class="subtitle-cell">Certificación de Mantenimiento Informático</th>
        </tr>
        <!-- Fila con los botones "Registrar" y "Consultar" -->
        <tr>
          <td colspan="2" class="button-row">
            <button type="button" onclick="registrar()">Registrar</button>
            <button type="button" onclick="consultar()">Consultar</button>
          </td>
        </tr>
      </table>
    </form>
  </div>

  <script>
    function registrar() {
      window.location.href = "registrar/registro.php";
    }

    function consultar() {
      window.location.href = "consultar/consulta.php";
    }
  </script>

</body>
</html>
